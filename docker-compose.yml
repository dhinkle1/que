version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4


  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    volumes:
      - ./frontend/web:/app
    ports:
      - "4001:4001"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
